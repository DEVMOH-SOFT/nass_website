<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASS LASUSTECH | Nigerian Association of Science Students</title>
    <link rel="icon" type="image/png" href="/nass_logo.png" />
    <meta name="description" content="Official platform of the Nigerian Association of Science Students (NASS), College of Basic Sciences, LASUSTECH Chapter. Representing basic science departments in discovery and innovation." />
    <meta name="author" content="NASS LASUSTECH Chapter" />

    <meta property="og:title" content="NASS LASUSTECH | College of Basic Sciences" />
    <meta property="og:description" content="The unified platform for science students at LASUSTECH. Access departmental resources, college dues, ID portal, and events." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/nass_logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nasslasustech" />
    <meta name="twitter:title" content="NASS LASUSTECH | College of Basic Sciences" />
    <meta name="twitter:description" content="Empowering the next generation of scientists and technological innovators at LASUSTECH." />
    <meta name="twitter:image" content="/nass_logo.png" />

    <!-- Typography: Modern Crisp Fonts (Outfit & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Korapay Gateway Collections Script -->
    <script id="korapay-inline-script" src="https://korablobstorage.blob.core.windows.net/modal-bucket/korapay-collections.min.js"></script>
  </head>

  <body>
    <!-- ======================================================== -->
    <!-- DIGNIFIED COLLEGIATE LOADING SCREEN                      -->
    <!-- Authentic College Building Banner + Understated Design   -->
    <!-- ======================================================== -->
    <div id="loading-screen" class="cbs-loading-bg" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;overflow:hidden">
      
      <!-- Subtle Architectural Vignette -->
      <div style="position:absolute;inset:0;background:radial-gradient(circle at center, transparent 35%, rgba(3, 15, 8, 0.55) 100%);pointer-events:none"></div>

      <!-- 3D Perspective Stage -->
      <div style="position:relative;width:90px;height:90px;display:flex;align-items:center;justify-content:center;perspective:1000px;z-index:2">
        <!-- 3D Flipping Crest Medallion -->
        <div style="position:relative;width:82px;height:82px;transform-style:preserve-3d;animation:flip-3d-medallion 2.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite">
          <!-- Front Face: NASS College Emblem -->
          <div style="position:absolute;inset:0;backface-visibility:hidden;border-radius:50%;border:2.5px solid #064e28;background:#ffffff;box-shadow:0 10px 25px rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px">
            <img src="/nass_logo.png" alt="NASS Crest" style="width:100%;height:100%;object-fit:contain;border-radius:50%" />
          </div>

          <!-- Back Face: LASUSTECH University Crest -->
          <div style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border-radius:50%;border:2.5px solid #1a4480;background:#ffffff;box-shadow:0 10px 25px rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px">
            <img src="/lasustech_logo.png" alt="LASUSTECH Crest" style="width:100%;height:100%;object-fit:contain" />
          </div>
        </div>
      </div>

      <!-- Institutional Identity (Clean, Dignified, Not Flashy) -->
      <div style="text-align:center;margin-top:24px;max-width:380px;padding:0 20px;z-index:2">
        <p style="margin:0;color:#ffffff;font-size:12.5px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;font-family:'Outfit',sans-serif">
          COLLEGE OF BASIC SCIENCES
        </p>
        <p style="margin:5px 0 0;color:#93c5fd;font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;font-family:'Inter',sans-serif">
          LASUSTECH • MAIN CAMPUS, IKORODU
        </p>
        <p style="margin:4px 0 0;color:rgba(255,255,255,0.7);font-size:9.5px;font-weight:500;letter-spacing:0.04em;font-family:'Inter',sans-serif">
          National Association of Science Students
        </p>
      </div>

      <!-- Minimalist LASUSTECH Blue Hairline Progress Bar -->
      <div style="margin-top:22px;width:120px;height:2px;background:rgba(255,255,255,0.18);border-radius:999px;overflow:hidden;position:relative;z-index:2">
        <div style="position:absolute;top:0;left:0;bottom:0;width:50%;background:#3b82f6;border-radius:999px;animation:progress-slide 1.5s infinite ease-in-out"></div>
      </div>

      <p style="margin:10px 0 0;color:rgba(255,255,255,0.55);font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;font-family:'Inter',sans-serif;z-index:2">
        Loading Academic Portal...
      </p>

      <style>
        .cbs-loading-bg {
          background: linear-gradient(135deg, rgba(6, 29, 16, 0.72) 0%, rgba(7, 31, 56, 0.78) 100%), url('/cbs_faculty_building.jpg') 78% center / cover no-repeat !important;
        }
        @media (max-width: 768px) {
          .cbs-loading-bg {
            background: linear-gradient(180deg, rgba(6, 29, 16, 0.62) 0%, rgba(7, 31, 56, 0.70) 100%), url('/cbs_faculty_building.jpg') 80% 32% / cover no-repeat !important;
          }
        }
        @keyframes flip-3d-medallion {
          0% { transform: rotateY(0deg); }
          50% { transform: rotateY(180deg); }
          100% { transform: rotateY(360deg); }
        }
        @keyframes progress-slide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Professional collegiate smooth reveal
      const startTime = Date.now();
      const hideLoader = () => {
        const elapsed = Date.now() - startTime;
        // Clean, pleasant 2-second hold time
        const remaining = Math.max(0, 2000 - elapsed);
        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.pointerEvents = 'none';
            setTimeout(() => {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 500);
          }
        }, remaining);
      };

      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          hideLoader();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
      // Fallback
      setTimeout(hideLoader, 4500);
    </script>
  </body>
</html>
